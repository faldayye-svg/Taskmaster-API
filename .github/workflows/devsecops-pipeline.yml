name: DevSecOps Security Delivery Gate

permissions:
  contents: read
  issues: write
  
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  software-supply-chain-analysis:
    name: Software Supply Chain Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run Snyk Open Source Scan
        uses: snyk/actions/node@master
        continue-on-error: true
        with:
          command: test
          args: --all-projects
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'TaskMaster-API'
          path: '.'
          format: 'HTML'

  dast-runtime-verification:
    name: DAST Runtime Verification
    needs: software-supply-chain-analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and start application
        run: docker compose up -d --build

      - name: Wait for application
        run: sleep 15

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8080'
          allow_issue_writing: false
          fail_action: false
          artifact_name: ''
